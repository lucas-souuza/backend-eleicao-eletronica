services:
  api:
    build:
      context: .
      target: development
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true
    command: npm run start:dev

volumes:
  node_modules:
